name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: NeuroPlasticity
            asset_name: neuroplasticity-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: NeuroPlasticity
            asset_name: neuroplasticity-macos-aarch64
          # NOTE: macos-13 was retired by GitHub in Dec 2025. Leaving it in the
          # matrix strands the whole run in "queued" until it is auto-cancelled
          # after 24h, which is what silently killed the v1.0.1 and v1.0.2
          # releases. Build both macOS architectures from an arm64 host.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: NeuroPlasticity
            asset_name: neuroplasticity-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Ensure cmake is available
        # Required to compile the vendored llama.cpp C++ sources for the
        # embedded provider. Preinstalled on GitHub macOS images, but verify
        # rather than assume: a release build that fails here ships nothing.
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install cmake
            else
              sudo apt-get install -y cmake
            fi
          fi
          cmake --version

      - name: Build release binary
        # The `embedded-llm` feature is REQUIRED. Without it the binary compiles
        # but every manifest using provider "embedded" aborts at runtime with
        # "The 'embedded' provider requires the 'embedded-llm' feature".
        # A quick sanity check on the produced binary follows the build.
        run: cargo build --release --features embedded-llm --target ${{ matrix.target }}

      - name: Verify embedded engine is present
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          # A binary built without the feature contains no llama.cpp symbols at
          # all, so assert on the vendored loader symbol.
          if ! strings "$BIN" | grep -q "llama_model_load_from_file"; then
            echo "::error::embedded-llm feature missing from $BIN — the released binary would abort on provider: embedded"
            exit 1
          fi
          echo "embedded engine verified in $BIN"

      - name: Rename binary for upload
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
